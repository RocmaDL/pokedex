name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI : qualité + tests + build, à chaque push et pull request.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires et fonctionnels (Jest)
        run: npm test

      - name: Build
        run: npm run build

  # CD : déploiement en production sur Vercel, seulement sur main et si la CI passe.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les secrets Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secrets VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID manquants (voir README)."
            exit 1
          fi

      - name: Récupérer la configuration Vercel
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Builder pour Vercel
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Déployer en production
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
